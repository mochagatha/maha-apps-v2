name: maha_apps_v2
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  camera: ^0.11.2
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  dio: ^5.9.0
  dropdown_search: ^6.0.1
  equatable: ^2.0.5
  file_picker: ^10.3.8
  flutter:
    sdk: flutter
  flutter_cached_pdfview: ^0.4.3
  flutter_dotenv: ^6.0.0
  flutter_localizations:
    sdk: flutter
  flutter_otp_text_field: ^1.1.1
  flutter_spinkit: ^5.2.2
  flutter_svg: ^2.2.3
  font_awesome_flutter: ^10.9.0
  geolocator: ^13.0.2
  get_it: ^7.6.0
  go_router: ^13.0.0
  google_fonts: ^6.3.2
  google_mlkit_face_detection: ^0.13.1
  image: ^4.3.0
  internet_connection_checker: ^1.0.0+1
  intl: ^0.20.2
  lottie: ^3.3.1
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  provider: ^6.1.5+1
  shared_preferences: ^2.5.3
  tflite_flutter: ^0.11.0
  timezone: ^0.9.4
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.4.6 # Code generation
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  mockito: ^5.4.2 # Mocking for tests

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/icon/
    - assets/images/svg/
    - assets/images/svg/arsip/
    - assets/fonts/
    - assets/audio/
    - assets/
    - assets/templates/
    - .env
