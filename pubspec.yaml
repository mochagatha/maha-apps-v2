name: maha_apps_v2
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.3
  flutter_dotenv: ^6.0.0
  google_fonts: ^6.3.2
  url_launcher: ^6.3.2
  # video_player: ^2.10.1
  lottie: ^3.3.1
  intl: ^0.20.2
  timezone: ^0.9.4
  
  # Absensi Feature Dependencies
  camera: ^0.11.0+2
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  path_provider: ^2.1.5
  image: ^4.3.0

  # Architecture Dependencies
  get_it: ^7.6.0 # Dependency Injection
  go_router: ^13.0.0 # Routing
  dartz: ^0.10.1 # Functional Programming
  equatable: ^2.0.5 # Value Equality
  internet_connection_checker: ^1.0.0+1 # Network Status

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.2 # Mocking for tests
  build_runner: ^2.4.6 # Code generation

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/icon/
    - assets/images/svg/
    - assets/images/svg/arsip/
    - assets/fonts/
    - assets/audio/
    - assets/
    - assets/templates/
    - .env
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
